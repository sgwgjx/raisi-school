<!DOCTYPE html>

<title>پنل دانش‌آموزی | مدرسه شهید آیت‌الله رئیسی شیراز</title>
<style>
@font-face{font-family:'Vazirmatn';src:url('Vazir-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
*,*::before,*::after{font-family:'Vazirmatn','Segoe UI',Tahoma,Arial,sans-serif!important}
/* ===== هویت بصری برگرفته از style.css سایت اصلی ===== */
:root{color-scheme:light;--bg:#eef4fa;--surface:#fff;--surface-2:#f4f8fc;--text:#182a3d;--text-light:#5a6b80;--primary:#15395f;--accent:#2f7ec3;--accent-strong:#1d5a99;--chip:#e0edf9;--chip-text:#1d5a99;--border:#d7e3ef;--btn:#1d5a99;--danger:#c02733;--ok:#2a8a57;--warn:#d9942b;--radius:8px}

*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{width:0;height:0;display:none}
body{font-family:'Vazirmatn','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.9;transition:background .3s,color .3s}
button,input,select,textarea{font-family:inherit;font-size:.95rem;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex-shrink:0}
/* چیدمان */
.side{position:fixed;inset:0 0 0 auto;width:250px;background:var(--surface);border-left:1px solid var(--border);padding:16px 12px;z-index:50;overflow-y:auto;transition:transform .3s}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);color:var(--text-light);cursor:pointer;font-weight:600;font-size:.92rem;margin-bottom:2px;transition:.2s}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--chip);color:var(--chip-text)}
.nav-out{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}.nav-out a{color:var(--danger)}.nav-out a:hover{background:#fde9ea;color:var(--danger)}
.empty{text-align:center;color:var(--text-light);padding:14px 0}.nw{cursor:pointer}.nw:hover{background:var(--surface-2)}
.main{margin-inline-start:250px;min-height:100vh}
.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 20px}
.top h1{font-size:1.1rem;color:var(--primary);flex:1}
.iconbtn{background:none;border:1px solid var(--border);border-radius:var(--radius);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;position:relative}
.iconbtn:hover{background:var(--surface-2)}
.dot{position:absolute;top:6px;left:6px;width:9px;height:9px;background:var(--danger);border-radius:50%}
.pop{position:absolute;top:56px;left:12px;width:300px;max-width:calc(100vw - 24px);display:none;z-index:60}.pop.open{display:block}
#menuBtn{display:none}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-strong);color:#fff;display:grid;place-items:center;font-weight:800;cursor:pointer;border:0}
.page{padding:20px;max-width:1150px;margin:auto;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card h2,.card h3{font-size:1rem;color:var(--primary);margin-bottom:10px}
.stat{display:flex;align-items:center;gap:14px}
.stat .si{width:48px;height:48px;border-radius:12px;background:var(--chip);color:var(--chip-text);display:grid;place-items:center;font-size:1.3rem}
.stat b{font-size:1.5rem;display:block;line-height:1.3}.stat span{color:var(--text-light);font-size:.85rem}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:12px;font-weight:700;border:1px solid transparent;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--btn);color:#fff}.btn-p:hover{transform:translateY(-2px)}
.btn-o{background:none;border-color:var(--accent);color:var(--accent-strong)}.btn-o:hover{background:var(--chip)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sw{position:relative;width:50px;height:26px;border-radius:999px;background:var(--border);border:0;cursor:pointer;flex-shrink:0;transition:background .25s;padding:0}
.sw i{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s}
.sw.on{background:var(--btn)}
.sw.on i{transform:translateX(-24px)}
.chip{display:inline-block;background:var(--chip);color:var(--chip-text);border-radius:999px;padding:1px 12px;font-size:.78rem;font-weight:700}
.chip.ok{background:#dff3e8;color:#1d6b42}.chip.warn{background:#fff3d6;color:#8a5a00}.chip.bad{background:#fde9ea;color:var(--danger)}

.chip.live{display:inline-flex;align-items:center;gap:6px}
.chip.live i{width:8px;height:8px;border-radius:50%;background:#1d6b42;flex-shrink:0;animation:pulse 1.2s infinite}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.row:last-child{border:0}.row .gr{flex:1;min-width:180px}.row small{color:var(--text-light);display:block}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar input,.bar select,.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;width:100%}
.bar input{flex:1;min-width:180px}.bar select{width:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{background:var(--primary);color:#fff;padding:9px;text-align:center;font-weight:700}
td{padding:9px;text-align:center;border-bottom:1px solid var(--border)}
.tw{overflow-x:auto}
.calh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.calh h2{margin:0;font-size:1.1rem;flex:1;text-align:center}.calh .navb{flex:none;width:44px;height:44px;padding:0;border-radius:12px;justify-content:center;align-items:center;gap:0;line-height:0}.navb .ic{width:22px;height:22px;stroke-width:2.5;vertical-align:baseline;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-weight:700;color:var(--text-light);font-size:.8rem}
.cal .d{min-height:54px;border:1px solid var(--border);border-radius:6px;padding:2px;font-size:.85rem;cursor:default}
.cal .d.today{border:2px solid var(--accent);background:var(--chip)}
.cal .d i{display:block;font-style:normal;font-size:.62rem;border-radius:4px;background:var(--accent-strong);color:#fff;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 3px}
.cal .d i.ev{background:var(--warn)}
.opts label{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:.2s}
.opts label:hover{background:var(--surface-2)}.opts label.sel{border-color:var(--accent);background:var(--chip)}
.exhead::before{content:'';position:absolute;left:-1px;right:-1px;top:-14px;height:14px;background:var(--bg)}.exhead{position:sticky;z-index:30;box-shadow:0 6px 12px -6px rgba(10,20,35,.18);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}.exhead .gr{display:flex;flex-direction:column;flex:1;min-width:0}.qc{margin-bottom:12px}.qc.flgd{border:2px solid var(--warn)}
.nsn{margin:6px 0 0;color:var(--text-light);font-size:.88rem;line-height:1.9}.more{color:var(--accent-strong,var(--accent));font-weight:700;text-decoration:none;white-space:nowrap}
.tt{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}.tt th{font-size:.82rem;padding:4px 2px}.tt th small{display:block;color:var(--text-light);font-weight:400}.tt td{vertical-align:middle;text-align:center;padding:0}.tt .dy{width:64px}.tt .dy b{display:block;font-size:.85rem}.tt tr.today .dy{background:var(--chip);border-radius:10px;padding:6px 2px}
.tc{background:var(--surface-2);border:1px solid var(--border);border-right:4px solid var(--accent);border-radius:10px;padding:8px 4px;min-height:58px;display:flex;flex-direction:column;justify-content:center;gap:2px}.tc b{font-size:.85rem}.tc small{color:var(--text-light);font-size:.7rem}.tt tr.today .tc{background:var(--chip)}
.sh{display:flex;align-items:center;gap:8px;margin:0 0 14px}.sh svg{width:24px;height:24px}
.dtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}.dtabs button{min-width:0;padding:10px 2px;font-size:.8rem;white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;font-weight:700;cursor:pointer}.dtabs button.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.bells{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.bl{display:flex;align-items:center;gap:14px;padding:14px;border-bottom:1px solid var(--border)}.bl:last-child{border-bottom:0}.bl .gr{display:flex;flex-direction:column;gap:2px}.bl small{color:var(--text-light)}.bn{background:var(--chip);color:var(--chip-text);border-radius:8px;padding:8px 14px;font-weight:700;font-size:.85rem;white-space:nowrap}
.qn{display:flex;flex-wrap:wrap;gap:6px}
.qn button{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:700}
.qn .ans{background:var(--chip);border-color:var(--accent)}.qn .flg{border:2px solid var(--warn)}.qn .cur{background:var(--btn);color:#fff}
.timer{font-size:1.4rem;font-weight:800;color:var(--danger);font-variant-numeric:tabular-nums}
.cd{font-size:.82rem;color:var(--text-light);margin-top:4px}.cd b{color:var(--warn);font-variant-numeric:tabular-nums;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;place-items:center;z-index:100;padding:16px}
.modal.open{display:grid}.modal .card{max-width:520px;width:100%;max-height:85vh;overflow:auto}
.fld{margin-bottom:12px}.fld label{display:block;font-size:.85rem;color:var(--text-light)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 22px;border-radius:12px;z-index:200;display:none}
.vgrid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.vc{display:flex;flex-direction:column;gap:14px;transition:.2s}.vc:hover{transform:translateY(-3px);border-color:var(--accent)}
.vc .vci{width:48px;height:48px;border-radius:12px;background:var(--chip);color:var(--chip-text);display:grid;place-items:center;font-size:1.4rem}
.vc .vcb{flex:1}.vc h3{margin:8px 0 2px;font-size:1.05rem}.vc small{color:var(--text-light)}.vc .btn{justify-content:center}
.qrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}.qrow h3{flex:1}.qimg{width:56px;height:56px;object-fit:contain;background:var(--surface-2);border-radius:8px;border:1px solid var(--border);cursor:zoom-in;flex-shrink:0;transition:.2s}.qimg:hover{transform:scale(1.06);border-color:var(--accent)}
.dn{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}.dn svg{width:170px;height:170px}.dl{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.85rem}.dl span{display:inline-flex;align-items:center;gap:6px}.dl i{width:12px;height:12px;border-radius:50%;display:inline-block}
.shade{display:none}
@media(max-width:900px){.side{transform:translateX(100%)}.side.open{transform:none}.main{margin:0}#menuBtn{display:grid}.shade.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}.page{padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cal .d i.ex{background:var(--primary)}.cal .d i.hol{background:var(--danger)}.cal .d i.info{background:var(--accent)}
.lg{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent-strong);flex-shrink:0}.lg.ex{background:var(--primary)}.lg.ev{background:var(--warn)}.lg.hol{background:var(--danger)}.lg.info{background:var(--accent)}
.row .lg{margin-inline-start:auto}
</style>
</head>

<script>
/* ===== پنل دانش‌آموزی — داده‌ها از Supabase (با توکن ورود دانش‌آموز) ===== */
const SB={url:location.origin+'/sb',key:'sb_publishable_1jSLYdzfmthl8HqMckO2yw_-dPmfE8c'};
const BUCKET='panel-files';
const DB={student:{name:'',grade:'',cls:''},exams:[],sched:{'شنبه':[],'یکشنبه':[],'دوشنبه':[],'سه‌شنبه':[],'چهارشنبه':[]},res:[],vcls:[],events:[],site:{},news:[],SITE:'index.html'};
const PAGES=[['dash','داشبورد','home'],['exams','آزمون‌های من','file'],['cal','تقویم','cal'],['sched','برنامه هفتگی','clock'],['res','منابع آموزشی','book'],['vcls','آموزش مجازی','vcr'],['news','اطلاعیه و اخبار','bell'],['prof','پروفایل','user'],['set','تنظیمات','gear']];
const $=s=>document.querySelector(s);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const dg=s=>String(s==null?'':s).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).trim();
const J=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const GN={7:'هفتم',8:'هشتم',9:'نهم'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="ic"><use href="#${n}"/></svg>`;
const pad=n=>String(n).padStart(2,'0');
const okUrl=u=>/^https?:\/\//i.test(String(u||'').trim());
const fileUrl=p=>/^https?:\/\//i.test(p)?p:SB.url+'/storage/v1/object/public/'+BUCKET+'/'+p;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function modal(h){$('#mbody').innerHTML=h+'<p style="margin-top:14px"><button class="btn btn-o" onclick="closeM()">بستن</button></p>';$('#modal').classList.add('open')}
function closeM(){$('#modal').classList.remove('open')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};

/* ---------- نشست و ارتباط با سرور ---------- */
const tok=()=>{try{return sessionStorage.getItem('stuTok')||localStorage.getItem('stuTok')||''}catch(e){return''}};
function tokClear(){try{sessionStorage.removeItem('stuTok');localStorage.removeItem('stuTok');Object.keys(localStorage).filter(k=>k.indexOf('ex:')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}
function toLogin(){tokClear();location.replace(DB.SITE)}
async function rpc(n,b){const r=await fetch(SB.url+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(b||{})});if(!r.ok)throw new Error('http '+r.status);return r.json()}
let SKEW=0,lastLoad=0;
const nowMs=()=>Date.now()+SKEW;

/* ---------- تاریخ شمسی ---------- */
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334],y=gm>2?gy+1:gy;let d=355666+365*gy+Math.floor((y+3)/4)-Math.floor((y+99)/100)+Math.floor((y+399)/400)+gd+g[gm-1],jy=-1595+33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365}return[jy,d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),1+(d<186?d%31:(d-186)%30)]}
const now=new Date(),TJ=g2j(now.getFullYear(),now.getMonth()+1,now.getDate());
const mlen=(y,m)=>m<=6?31:m<=11?30:([1,5,9,13,17,22,26,30].includes(y%33)?30:29);
const wdToday=(now.getDay()+1)%7; // شنبه=۰
const jfmt=d=>fa(d[0])+'/'+fa(pad(d[1]))+'/'+fa(pad(d[2]));
function firstWd(y,m){let off=-(TJ[2]-1),cy=TJ[0],cm=TJ[1];
 while(cy>y||(cy===y&&cm>m)){cm--;if(cm<1){cm=12;cy--}off-=mlen(cy,cm)}
 while(cy<y||(cy===y&&cm<m)){off+=mlen(cy,cm);cm++;if(cm>12){cm=1;cy++}}
 return((wdToday+off)%7+7)%7}
function tparts(ms){try{const o={};new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{timeZone:'Asia/Tehran',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ms)).forEach(p=>o[p.type]=p.value);return{y:+o.year,m:+o.month,d:+o.day,hh:+o.hour,mm:+o.minute}}catch(e){const j=g2j(new Date(ms).getFullYear(),new Date(ms).getMonth()+1,new Date(ms).getDate());return{y:j[0],m:j[1],d:j[2],hh:new Date(ms).getHours(),mm:new Date(ms).getMinutes()}}}
const hm=ms=>{const t=tparts(ms);return fa(pad(t.hh)+':'+pad(t.mm))};

8:[['علوم تجربی','فارسی','ریاضی','عربی'],['ریاضی','مطالعات اجتماعی','علوم تجربی','قرآن'],['زبان انگلیسی','ریاضی','نگارش','تربیت بدنی'],['فارسی','کار و فناوری','پیام‌های آسمان','ریاضی'],['فرهنگ و هنر','مطالعات اجتماعی','زبان انگلیسی','علوم تجربی']],
9:[['فارسی','ریاضی','مطالعات اجتماعی','علوم تجربی'],['عربی','ریاضی','زبان انگلیسی','پیام‌های آسمان'],['علوم تجربی','فارسی','تربیت بدنی','ریاضی'],['قرآن','مطالعات اجتماعی','کار و فناوری','زبان انگلیسی'],['ریاضی','فرهنگ و هنر','نگارش','علوم تجربی']]};

function classes(){const c=DB.site.classes;return Array.isArray(c)&&c.length?c:DEF_CLASSES}
function myClass(){return classes().find(c=>c.id===DB.cid)||{id:DB.cid,name:DB.cid,grade:DB.grade}}
function buildSched(){const s=DB.site,cls=myClass();let rows=Array.isArray(s.schedule)?s.schedule:null;
 if(!rows){const grid=(s.weekGrid&&s.weekGrid[cls.grade])||DEF_GRID[cls.grade];if(grid){const same=classes().filter(c=>+c.grade===+cls.grade),sh=Math.max(0,same.findIndex(c=>c.id===cls.id));rows=grid.map((_,i)=>grid[(i+sh)%grid.length].slice())}}
 rows=rows||[];const T={};if(Array.isArray(s.teachers)&&s.teachers.length)s.teachers.forEach(t=>{if(t.subject&&(!t.role||t.role==='teacher'))T[t.subject]=t.name});else Object.assign(T,DEF_TEACH);
 const st=Array.isArray(s.schedTeachers)?s.schedTeachers:[];const out={};
 DAYS.forEach((d,di)=>{out[d]=(rows[di]||[]).map((sub,pi)=>[sub,(st[pi]&&st[pi][di])||T[sub]||'—'])});DB.sched=out}

const nkey=a=>{const t=dg(a.date),d=(t.match(/\d+/g)||[]).map(Number);let day=d[0]||0,y=d.find(n=>n>1300)||0,m=J.findIndex(x=>t.indexOf(x)>=0)+1;return y*10000+m*100+day};

 (DB.site.exams||[]).forEach(x=>{let y=x.dateY,mo=x.dateM,d=x.dateD;if(!(y&&mo&&d)){const t=dg(x.date),r=t.match(/(\d+)\s+(\S+)\s+(\d{4})/);if(r){d=+r[1];mo=J.indexOf(r[2])+1;y=+r[3]}}if(y&&mo&&d)add(y,mo,d,'امتحان '+(x.subject||''),'ex')});return m}

const cdTxt=ms=>{const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s/3600),m=Math.floor(s/60);return d>0?fa(d)+' روز':h>0?fa(h)+' ساعت':m>0?fa(m)+' دقیقه':fa(s)+' ثانیه'};
const clk=s=>fa(pad(Math.floor(s/60))+':'+pad(s%60));
const exKey=id=>'ex:'+id;
function exLoad(id){try{return JSON.parse(localStorage.getItem(exKey(id))||'{}')}catch(e){return{}}}
function exStore(){const x=S.ex;if(!x||x.done)return;try{localStorage.setItem(exKey(x.e.id),JSON.stringify({a:x.a}))}catch(e){}}

function cdHtml(e,st){const end=e.start+e.dur*60000;return st==='upcoming'?'شروع تا <b>'+cdTxt(e.start-nowMs())+'</b>':'بسته تا <b>'+clk(Math.max(0,Math.floor((end-nowMs())/1000)))+'</b>'}
function exRows(l){return l.map(e=>{const st=stOf(e),live=st==='upcoming'||st==='open';let act='';
 if(st==='done')act=`<span class="chip ok">نمره ${fa(e.score)}</span>${e.kind==='online'?`<button class="btn btn-o" onclick="showResult('${e.id}')">نتیجه</button>`:''}`;
 else if(st==='open')act=e.kind==='link'?`<button class="btn btn-p" onclick="openExt('${e.id}')">${ic('vcr')} ورود به آزمون</button>`:`${e.started?'<span class="chip warn">نیمه‌کاره</span>':''}<button class="btn btn-p" onclick="startEx('${e.id}')">${e.started?'ادامه آزمون':'شروع آزمون'}</button>`;
 else if(st==='upcoming')act=`<button class="btn btn-o" onclick="toast('این آزمون هنوز فعال نشده است')">در انتظار</button>`;
 return`<div class="row"><div class="gr"><b>${esc(e.t)}</b> <span class="chip">${jfmt(e.date)}</span><small>${e.type} · ساعت ${hm(e.start)} تا ${hm(e.start+e.dur*60000)} · ${fa(e.dur)} دقیقه${e.kind==='online'&&e.qn?' · '+fa(e.qn)+' سؤال':''}</small>${e.desc?`<p class="nsn">${esc(e.desc)}</p>`:''}${live?`<div class="cd" data-e="${e.id}">${cdHtml(e,st)}</div>`:''}</div>${stCh(st)}${act}</div>`}).join('')}
const prevSt={};

function donut(t){const T=(t.c+t.w+t.n)||1,R=50,C=2*Math.PI*R;let off=0;const seg=[[t.c,'var(--ok)','درست'],[t.w,'var(--danger)','نادرست'],[t.n,'var(--warn)','بدون پاسخ']];
 const arcs=seg.filter(x=>x[0]>0).map(x=>{const len=x[0]/T*C,r=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${x[1]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return r}).join('');
 return`<div class="dn"><svg viewBox="0 0 140 140" role="img" aria-label="نمودار پاسخ‌ها"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--border)" stroke-width="22"/>${arcs}<text x="70" y="77" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text)">${fa(Math.round(t.c/T*100))}٪</text></svg><div class="dl">${seg.map(x=>`<span><i style="background:${x[1]}"></i>${x[2]}: <b>${fa(x[0])}</b></span>`).join('')}</div></div>`}
function showResult(id){const e=DB.exams.find(x=>x.id===id);if(!e)return;modal(`<h2 style="text-align:center">${esc(e.t)}</h2><p style="text-align:center">نمره: <b style="color:var(--ok);font-size:1.3rem">${fa(e.score)}</b> از ۲۰</p>${e.stat?donut(e.stat):''}`)}

 try{const r=await rpc('student_exam_start',{p_token:tok(),p_exam_id:id});
  if(!r.ok){if(r.error==='auth')return toLogin();toast({not_started:'هنوز زمان آزمون نرسیده است',closed:'زمان این آزمون تمام شده است',already:'این آزمون را قبلاً پایان داده‌اید',not_found:'این آزمون برای شما فعال نیست'}[r.error]||'امکان شروع آزمون نیست');reload();return}
  const sv=exLoad(id);S.ex={e,qs:r.questions||[],a:sv.a||{},done:false,deadline:Date.now()+r.left*1000,left:r.left,tries:0};S.page='exams';render();scrollTo(0,0);exStore();
  S.ts=setInterval(()=>{const x=S.ex;if(!x||x.done){endTimer();return}x.left=Math.max(0,Math.ceil((x.deadline-Date.now())/1000));const t=$('#tm');if(t)t.textContent=clk(x.left);if(x.left<=0)finish(true)},1000)}
 catch(err){toast('ارتباط با سرور برقرار نشد؛ دوباره امتحان کنید')}}
function endTimer(){clearInterval(S.ts);S.ts=null}
function qImg(q){return q.img?fileUrl(q.img):''}
function runner(){const x=S.ex,N=x.qs.length;
 if(x.done){const r=x.res;return`<div class="card" style="text-align:center"><h2>آزمون پایان یافت</h2>${r?`<p style="font-size:2rem;font-weight:800;color:var(--accent-strong)">${fa(r.c)} از ${fa(N)}</p><p>نمره: <b style="color:var(--ok)">${fa(r.score)}</b> از ۲۰</p>${donut({c:r.c,w:r.w,n:r.n})}`:'<p>زمان ثبت پاسخ‌ها گذشته بود و نتیجه‌ای ثبت نشد.</p>'}<p style="margin-top:16px"><button class="btn btn-p" onclick="S.ex=null;render()">بازگشت به آزمون‌ها</button></p></div>`}
 const th=(document.querySelector('.top')||{}).offsetHeight||60;
 return`<div class="exhead" style="top:${th}px"><div class="gr"><b>${esc(x.e.t)}</b><small>پاسخ‌داده: <span id="cnt">${fa(Object.keys(x.a).length)}</span> از ${fa(N)}</small></div><span class="timer" id="tm">${clk(x.left)}</span></div>
 ${x.qs.map((q,n)=>`<div class="card qc" id="q${n}"><small style="color:var(--text-light)">سؤال ${fa(n+1)} از ${fa(N)}</small><div class="qrow"><h3 style="color:var(--text);font-size:1.05rem;margin:8px 0 0">${esc(q.q)}</h3>${q.img?`<img class="qimg" src="${esc(qImg(q))}" alt="تصویر سؤال" title="برای بزرگ‌نمایی لمس کنید" onclick="zoomQ(${n})">`:''}</div><div class="opts">${q.o.map((o,k)=>`<label class="${x.a[n]===k?'sel':''}"><input type="radio" name="o${n}" ${x.a[n]===k?'checked':''} onchange="pick(${n},${k})"> ${esc(o)}</label>`).join('')}</div></div>`).join('')}
 <div class="card"><button class="btn btn-p" style="width:100%" onclick="if(confirm('آزمون را پایان می‌دهید؟'))finish()">پایان آزمون</button></div>`}
function pick(n,k){const x=S.ex;if(!x||x.done)return;x.a[n]=k;document.querySelectorAll('#q'+n+' .opts label').forEach((l,i)=>l.classList.toggle('sel',i===k));const c=$('#cnt');if(c)c.textContent=fa(Object.keys(x.a).length);exStore()}
async function finish(auto){const x=S.ex;if(!x||x.done||x.sending)return;x.sending=true;endTimer();
 try{const r=await rpc('student_exam_submit',{p_token:tok(),p_exam_id:x.e.id,p_answers:x.a});
  if(!r.ok&&r.error==='auth')return toLogin();
  if(!r.ok&&r.error!=='already'&&r.error!=='late')throw 0;
  x.done=true;x.res=r.ok?r:null;exClear(x.e.id);await reload(true);render();toast(r.ok?(auto?'زمان آزمون تمام شد و پاسخ‌ها ثبت شد':'نتیجه آزمون ثبت شد'):'زمان ثبت پاسخ‌ها گذشته است')}
 catch(err){x.sending=false;if(++x.tries<30){toast('ثبت پاسخ‌ها انجام نشد؛ اینترنت را بررسی کنید. دوباره تلاش می‌شود…');setTimeout(()=>finish(true),5000)}else toast('ثبت پاسخ‌ها ممکن نشد؛ دکمه «پایان آزمون» را بزنید')}}

/* ---------- سایر ---------- */
function zoomQ(n){const q=S.ex&&S.ex.qs[n];if(!q||!q.img)return;modal(`<img src="${esc(qImg(q))}" alt="تصویر سؤال" style="width:100%;height:auto;display:block;border-radius:8px">`)}
function joinV(i){const u=((DB.vcls[i]||{}).url||'').trim();if(!okUrl(u))return toast('لینک این کلاس معتبر نیست');window.open(u,'_blank','noopener,noreferrer')}
function cm(d){S.cm+=d;if(S.cm>12){S.cm=1;S.cy++}if(S.cm<1){S.cm=12;S.cy--}render()}
async function chgPw(){const o=$('#pw0'),a=$('#pw1'),b=$('#pw2');if(!o.value||!a.value||!b.value)return toast('هر سه فیلد رمز را پر کنید');if(a.value.length<6)return toast('رمز عبور باید حداقل ۶ کاراکتر باشد');if(a.value!==b.value)return toast('رمز و تکرار آن یکسان نیستند');
 try{const r=await rpc('student_change_password',{p_token:tok(),p_old:dg(o.value),p_new:dg(a.value)});
  if(r.ok){o.value=a.value=b.value='';toast('رمز عبور با موفقیت تغییر کرد')}else if(r.error==='wrong_old')toast('رمز فعلی اشتباه است');else if(r.error==='auth')toLogin();else toast('تغییر رمز انجام نشد')}catch(e){toast('ارتباط با سرور برقرار نشد')}}
function toSite(h){try{sessionStorage.setItem('fromPanel','1')}catch(e){}location.href=DB.SITE+h}
function showNews(i){const n=DB.news[i];if(!n)return;toSite('#news='+encodeURIComponent(n.t))}
$('#menuBtn').onclick=()=>{$('#side').classList.add('open');$('#shade').classList.add('open')};
$('#shade').onclick=()=>{$('#side').classList.remove('open');$('#shade').classList.remove('open')};
$('#avBtn').onclick=()=>go('prof');
$('#bellBtn').onclick=()=>{const p=$('#pop');p.innerHTML='<h3>اعلان‌ها</h3>'+(DB.news.length?'':'<p class="empty">اعلانی وجود ندارد</p>')+DB.news.slice(0,3).map((n,i)=>`<div class="row nw" onclick="showNews(${i})"><small style="color:var(--text)">${esc(n.t)}</small></div>`).join('')+'<p style="margin-top:8px"><button class="btn btn-o" onclick="go(\'news\')">همه اطلاعیه‌ها</button></p>';p.classList.toggle('open');const d=document.querySelector('.dot');if(d)d.style.display='none'};
document.addEventListener('click',e=>{const p=$('#pop');if(p.classList.contains('open')&&!e.target.closest('#bellBtn')&&!e.target.closest('#pop'))p.classList.remove('open')});
$('#logoutBtn').onclick=()=>{if(S.ex&&!S.ex.done&&!confirm('آزمون در حال برگزاری است و زمان آن ادامه دارد؛ خارج می‌شوید؟'))return;const t=tok();rpc('student_logout',{p_token:t}).catch(()=>{});toLogin()};
$('#logoutBtn').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#logoutBtn').click()}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.ex&&Date.now()-lastLoad>60000)reload(true).then(()=>{if(!S.ex)render()})});

/* ---------- شروع ---------- */
(async function boot(){
 if(!tok())return toLogin();
 $('#page').innerHTML='<div class="card"><p class="empty">در حال دریافت اطلاعات…</p></div>';
 try{const d=await rpc('student_panel_data',{p_token:tok()});if(!d.ok)return toLogin();apply(d);DB.exams.forEach(e=>prevSt[e.id]=stOf(e));render()}
 catch(e){$('#page').innerHTML='<div class="card" style="text-align:center"><p class="empty">ارتباط با سرور برقرار نشد.</p><button class="btn btn-p" onclick="location.reload()">تلاش دوباره</button></div>'}
})();
</script>
</body>
</html>
